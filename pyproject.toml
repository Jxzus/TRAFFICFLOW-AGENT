[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficflow-agent"
version = "0.1.0"
description = "Agente de predicción de congestión vehicular a 30 minutos (METR-LA)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "tables", "pyyaml", "torch"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
